<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>柯爾鴨精品休閒館 台中館｜線上預約</title>
<!--
  ===== 設定說明 =====
  1. 預覽模式：CONFIG.firebase 留 null 時，資料只存在這個分頁，重新整理就會回到範例資料。
  2. 正式上線：把 Firebase 的 firebaseConfig 貼到下方 CONFIG.firebase。
     集合：duck_public（公開：日期、寵物名字、主人姓氏遮罩）
           duck_bookings（後台：主人姓名、聯絡方式、備註）
           duck_capacity（每晚鴨鵝已佔用數，防止超收）
           duck_gallery（館內環境照片，從後台上傳）
  3. 後台登入：
     預覽模式用 CONFIG.adminPin（預設 1234）。
     接上 Firebase 後改用 Firebase 帳號登入（Authentication → 電子郵件/密碼），
     只有 Firestore 規則裡列出 UID 的帳號能看到主人資料。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FAF5EC;
  --paper:#FFFDF8;
  --latte:#EADCC8;
  --latte-soft:#F4EBDD;
  --milk:#C9A27A;
  --brown:#93694A;
  --cocoa:#4B382B;
  --soft:#7A6352;
  --bill:#E8A25A;
  --low:#C9822F;
  --low-bg:#FBEBD4;
  --full:#B04E3C;
  --full-bg:#F6DDD6;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--cocoa);font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.65}
h1,h2,h3{font-family:"Huninn","Noto Sans TC",sans-serif;font-weight:400;margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--milk);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}

/* ---------- 頂部 ---------- */
.topbar{position:sticky;top:0;z-index:10;background:rgba(250,245,236,.94);backdrop-filter:blur(6px);border-bottom:2px solid var(--latte)}
.topbar-in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.brand .logo{width:35px;height:45px;flex:0 0 auto;object-fit:contain}
.brand-name{font-family:"Huninn",sans-serif;font-size:18px;line-height:1.2;color:var(--brown)}
.brand-name small{display:block;font-size:13px;color:var(--soft)}
.book-btn{border:0;background:var(--brown);color:#fff;border-radius:999px;padding:8px 18px;font-family:"Huninn",sans-serif;font-size:17px;cursor:pointer;box-shadow:0 3px 0 #74503A;flex:0 0 auto}
.book-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #74503A}
.demo-note{margin:12px 0 0;font-size:13.5px;color:var(--soft);background:var(--latte-soft);border-radius:12px;padding:6px 12px}

/* ---------- 卡片 ---------- */
.panel{background:var(--paper);border-radius:26px;padding:20px 18px;margin-top:16px;border:2px solid var(--latte)}
.panel h2{font-size:23px;color:var(--brown)}
.hint{color:var(--soft);font-size:14px;margin:0}

/* ---------- 今日鴨鴨 ---------- */
.day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.status{display:inline-block;border-radius:999px;padding:2px 12px;font-size:14px;margin-top:6px;background:var(--latte-soft);color:var(--brown)}
.status.low{background:var(--low-bg);color:#8A520F}
.status.full{background:var(--full-bg);color:var(--full)}
.count{text-align:right;font-family:"Huninn",sans-serif;font-size:38px;line-height:1;color:var(--brown)}
.count small{display:block;font-size:13px;color:var(--soft);font-family:"Noto Sans TC",sans-serif;margin-top:4px}
.meter{height:10px;border-radius:999px;background:var(--latte-soft);margin-top:14px;overflow:hidden}
.meter span{display:block;height:100%;border-radius:999px;background:var(--milk);transition:width .3s}
.meter span.low{background:var(--low)}
.meter span.full{background:var(--full)}
.others{margin-top:8px;font-size:14px;color:var(--soft)}
.others:empty{display:none}
.guest{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:2px dotted var(--latte)}
.guest:first-child{border-top:0}
.guest .em{font-size:26px;line-height:1;width:34px;text-align:center;padding-top:3px;flex:0 0 auto}
.avs{display:flex;flex:0 0 auto;padding-top:2px}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 0 0 2px var(--latte);background:var(--latte-soft);cursor:zoom-in;padding:0}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.avs .av + .av{margin-left:-16px}
.av-more{width:48px;height:48px;border-radius:50%;margin-left:-16px;background:var(--latte);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--brown)}
.photo-pick{width:46px;height:46px;flex:0 0 auto;border-radius:50%;border:2px dashed var(--milk);background:var(--latte-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1.1;color:var(--brown);padding:0;overflow:hidden;text-align:center}
.photo-pick img{width:100%;height:100%;object-fit:cover}
.photo-pick.has{border-style:solid}
.bk-pets{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px}
.bk-pet{display:flex;align-items:center;gap:8px;font-size:14.5px}
.bk-pet .photo-pick{width:40px;height:40px}
.big-photo{max-width:min(320px,80vw);width:100%;aspect-ratio:1;border-radius:24px;object-fit:cover;display:block;margin:0 auto}
.guest .names{font-family:"Huninn",sans-serif;font-size:18px}
.guest .meta{font-size:13.5px;color:var(--soft)}
.badge{display:inline-block;font-size:12.5px;border-radius:999px;padding:0 9px;margin-left:6px;vertical-align:2px;font-family:"Noto Sans TC",sans-serif}
.badge.in{background:var(--low-bg);color:#8A520F}
.badge.stay{background:var(--latte-soft);color:var(--brown)}
.badge.out{background:#EEE8E2;color:#6F6158}
.empty-state{text-align:center;color:var(--soft);padding:16px 0 4px}
.ghost-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--brown);background:none;color:var(--brown);border-radius:16px;padding:9px;font-family:"Huninn",sans-serif;font-size:17px;cursor:pointer}

/* ---------- 月曆 ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-nav{border:2px solid var(--latte);background:#fff;border-radius:12px;width:40px;height:40px;font-size:18px;color:var(--brown);cursor:pointer}
.cal-nav:disabled{opacity:.35;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.wd{text-align:center;font-size:13px;color:var(--soft);padding-bottom:2px}
.cell{
  aspect-ratio:1/1.08;border:2px solid transparent;background:var(--latte-soft);border-radius:14px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;line-height:1.15;
}
.cell .num{font-family:"Huninn",sans-serif;font-size:17px}
.cell .st{font-size:11.5px;font-weight:700;min-height:1.15em}
.cell.low{background:var(--low-bg)} .cell.low .st{color:#8A520F}
.cell.full{background:var(--full-bg)} .cell.full .st{color:var(--full)}
.cell.past{background:transparent;color:#B4A595}
.cell.today .num{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.cell.sel{border-color:var(--brown);background:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--soft)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}

/* ---------- 表單 ---------- */
.back{border:0;background:none;color:var(--brown);cursor:pointer;padding:12px 0 0;font-size:15px}
.group{margin-top:18px}
.group > .label{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.req{color:var(--low);font-weight:400;font-size:13px;margin-left:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{width:100%;border:2px solid var(--latte);background:#fff;border-radius:14px;padding:10px 12px;font-size:16px;min-height:46px}
.field:focus{border-color:var(--milk);outline:none}
textarea.field{min-height:84px;resize:vertical}
.small-label{display:block;font-size:13px;color:var(--soft);margin-bottom:3px}
.avail{margin-top:12px;border-radius:14px;padding:9px 12px;font-size:14.5px;background:var(--latte-soft);color:var(--brown)}
.avail.warn{background:var(--full-bg);color:var(--full)}
.pet-row{border:2px dashed var(--latte);border-radius:20px;padding:12px;margin-top:10px}
.type-pick{display:flex;flex-wrap:wrap;gap:6px}
.type-chip{border:2px solid var(--latte);background:#fff;border-radius:999px;padding:4px 11px 4px 8px;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.type-chip.on{border-color:var(--brown);background:var(--latte-soft)}
.pet-line{display:flex;gap:8px;margin-top:10px;align-items:center}
.pet-line .field{flex:1}
.stepper{display:flex;align-items:center;border:2px solid var(--latte);border-radius:14px;overflow:hidden;background:#fff;flex:0 0 auto}
.stepper button{border:0;background:none;width:38px;height:42px;font-size:20px;cursor:pointer;color:var(--brown)}
.stepper output{min-width:28px;text-align:center;font-family:"Huninn",sans-serif;font-size:18px}
.row-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.qty-note{font-size:12.5px;color:var(--soft)}
.link-btn{border:0;background:none;color:var(--soft);text-decoration:underline;cursor:pointer;font-size:13.5px;padding:4px 0}
.add-pet{margin-top:10px;width:100%;border:2px dashed var(--milk);background:none;border-radius:16px;padding:9px;color:var(--brown);cursor:pointer;font-size:15px}
.btn{display:block;width:100%;margin-top:22px;border:0;border-radius:18px;padding:13px;cursor:pointer;background:var(--brown);color:#fff;font-family:"Huninn",sans-serif;font-size:19px;box-shadow:0 4px 0 #74503A}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #74503A}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--full);font-size:14px;margin-top:10px;min-height:1em}

/* ---------- 後台 ---------- */
.pin-row{display:flex;gap:8px;margin-top:14px}
.pin-row .field{flex:1;letter-spacing:.3em;text-align:center}
.pin-row .btn{width:auto;margin:0;padding:0 20px;font-size:17px}
.seg{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.seg button{border:2px solid var(--latte);background:#fff;border-radius:999px;padding:4px 14px;cursor:pointer;font-size:14.5px}
.seg button[aria-pressed="true"]{border-color:var(--brown);background:var(--brown);color:#fff}
.bk{border:2px solid var(--latte);border-radius:20px;padding:12px 14px;margin-top:10px}
.bk.canceled{opacity:.5}
.bk-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bk-dates{font-family:"Huninn",sans-serif;font-size:17px;color:var(--brown)}
.bk-owner{font-weight:700}
.bk p{margin:4px 0 0;font-size:14.5px}
.bk a{color:var(--brown)}
.bk .note{background:var(--latte-soft);border-radius:10px;padding:6px 10px;margin-top:6px;font-size:14px}
.cancel-btn{border:0;background:none;color:var(--full);cursor:pointer;font-size:13.5px;text-decoration:underline;padding:4px 0;margin-top:4px}

/* ---------- 其他 ---------- */
.overlay{position:fixed;inset:0;background:rgba(75,56,43,.35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.sheet{background:var(--paper);border-radius:26px;padding:24px 22px;max-width:380px;width:100%;text-align:center;border:2px solid var(--latte)}
.sheet h3{font-size:24px;color:var(--brown);margin-top:4px}
.sheet .sum{text-align:left;background:var(--latte-soft);border-radius:16px;padding:10px 14px;margin-top:12px;font-size:14.5px}
.sheet .btn{margin-top:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--cocoa);color:#fff;padding:9px 18px;border-radius:999px;font-size:14.5px;z-index:30;max-width:90vw;text-align:center}
/* ---------- 館內環境 ---------- */
.gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px -18px 0;padding:0 18px 6px;scroll-padding:0 18px;-webkit-overflow-scrolling:touch}
.g-item{flex:0 0 86%;scroll-snap-align:start;border:0;background:none;padding:0;cursor:zoom-in;text-align:left}
.g-item img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;display:block;background:var(--latte-soft)}
.g-cap{display:block;font-size:14px;color:var(--soft);margin-top:6px;min-height:1.2em}
.ga-row{display:flex;gap:10px;align-items:center;margin-top:12px}
.ga-row img{width:84px;height:63px;object-fit:cover;border-radius:12px;flex:0 0 auto}
.ga-row .field{flex:1;min-height:40px;padding:7px 10px;font-size:15px}
.ga-tools{display:flex;flex-direction:column;gap:2px;flex:0 0 auto}
.ga-tools button{border:0;background:none;cursor:pointer;font-size:13px;color:var(--soft);padding:2px 4px}
.ga-tools .del{color:var(--full)}
.big-photo.wide{aspect-ratio:auto;max-width:min(560px,90vw);max-height:70vh;object-fit:contain}
.sheet.wide{max-width:600px}
@media (max-width:400px){.gallery{margin:12px -14px 0;padding:0 14px 6px;scroll-padding:0 14px}}

/* ---------- 手機不跑版 ---------- */
html,body{overflow-x:hidden}
.field,label{min-width:0}
input[type="date"].field{display:block;-webkit-appearance:none;appearance:none;text-align:left;line-height:1.3}
input[type="date"]::-webkit-date-and-time-value{text-align:left}
.qty{display:flex;align-items:center;gap:8px}
.row-foot{margin-top:10px}
.guest > div:last-child,.bk p,.brand-name{min-width:0;overflow-wrap:anywhere}
.brand-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-head > div:first-child{min-width:0}
.sheet{max-height:90vh;overflow-y:auto}
@media (max-width:400px){
  .wrap{padding:0 12px 40px}
  .topbar-in{padding:8px 12px}
  .brand .logo{width:31px;height:40px}
  .brand-name{font-size:16px}
  .book-btn{padding:7px 14px;font-size:16px}
  .panel{padding:16px 14px;border-radius:22px}
  .panel h2{font-size:20px}
  .count{font-size:32px}
  .cal{gap:3px}
  .cell{border-radius:10px}
  .cell .num{font-size:15px}
  .cell .st{font-size:10.5px}
  .type-chip{font-size:13.5px;padding:3px 9px 3px 6px}
  .pet-row{padding:10px}
  .row2{grid-template-columns:1fr}
  .seg button{font-size:13.5px}
}
footer{text-align:center;margin-top:28px;font-size:13px;color:var(--soft)}
footer button{border:0;background:none;color:var(--soft);text-decoration:underline;cursor:pointer;font-size:13px}
</style>
</head>

const TYPES = [
  {key:'duck',  label:'柯爾鴨', emoji:'🦆', wf:true},
  {key:'goose', label:'鵝',     emoji:'🪿', wf:true},
  {key:'dog',   label:'狗狗',   emoji:'🐶'},
  {key:'cat',   label:'貓咪',   emoji:'🐱'},
  {key:'bird',  label:'鳥類',   emoji:'🐦'},
  {key:'other', label:'其他',   emoji:'🐾'}
];
const T = Object.fromEntries(TYPES.map(t => [t.key, t]));
const CAP = CONFIG.waterfowlCap;

/* ================== 小工具 ================== */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [a,b,c] = s.split('-').map(Number); return new Date(a, b-1, c); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const nightsOf = (a, b) => { const out = []; for (let d = a; d < b; d = addDays(d,1)) out.push(d); return out; };
const WD = '日一二三四五六';
const md = s => { const d = parse(s); return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wfCount = pets => pets.reduce((s,p) => s + (T[p.type]?.wf ? (Number(p.qty)||0) : 0), 0);
const mask = n => { n = String(n||'').trim(); return n ? n[0] + '○○' : ''; };
const active = b => b.status !== 'canceled';
const petText = p => `${T[p.type]?.emoji||'🐾'} ${esc(p.name)}${p.qty>1 ? `（${p.qty} 隻）` : ''}`;

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600);
}
class FullError extends Error { constructor(date){ super('full'); this.date = date; } }

function splitDoc(d){
  const pets = d.pets.map(p => ({type:p.type, name:p.name.trim(), qty:Number(p.qty)||1, photo:p.photo||''}));
  const base = {checkIn:d.checkIn, checkOut:d.checkOut, pets, waterfowl:wfCount(pets), status:'active', createdAt:Date.now()};
  return {
    pub:  {...base, ownerMasked: mask(d.ownerName)},
    priv: {...base, ownerName:d.ownerName.trim(), contact:d.contact.trim(), notes:(d.notes||'').trim()}
  };
}

let publicList = [];
let privateList = [];
const occupancyOn = (date, list = publicList) =>
  list.filter(b => active(b) && b.checkIn <= date && date < b.checkOut).reduce((s,b) => s + (b.waterfowl||0), 0);

/* ================== 資料層：預覽模式 ================== */
function makeDemoStore(){
  const pub = [], priv = [], subsP = [], subsV = [], gal = [], subsG = [];
  const emitG = () => subsG.forEach(f => f(gal.map(x => ({...x}))));
  DEFAULT_GALLERY.forEach((g,k) => gal.push({id:'g0'+k, ...g, order:k}));
  let seq = 1;
  const snap = arr => arr.map(x => ({...x}));
  const emit = () => { subsP.forEach(f => f(snap(pub))); subsV.forEach(f => f(snap(priv))); };
  const add = data => { const id = 'demo' + (seq++); const {pub:p, priv:v} = splitDoc(data); pub.push({id, ...p}); priv.push({id, ...v}); };
  const t = today();
  add({checkIn:addDays(t,-1), checkOut:addDays(t,2), ownerName:'林小姐', contact:'0912-345-678', notes:'怕打雷，晚上請留小夜燈', pets:[{type:'duck',name:'布丁',qty:1},{type:'duck',name:'麻糬、湯圓',qty:2}]});
  add({checkIn:t, checkOut:addDays(t,1), ownerName:'陳先生', contact:'LINE: chen_duck', notes:'', pets:[{type:'goose',name:'大白',qty:1}]});
  add({checkIn:addDays(t,-2), checkOut:t, ownerName:'王小姐', contact:'0987-654-321', notes:'會自備飼料', pets:[{type:'cat',name:'咪咪',qty:1}]});
  add({checkIn:addDays(t,4), checkOut:addDays(t,6), ownerName:'吳小姐', contact:'0922-111-000', notes:'鴨鴨社團團體入住', pets:[{type:'duck',name:'鴨鴨團',qty:15}]});
  add({checkIn:addDays(t,5), checkOut:addDays(t,6), ownerName:'黃先生', contact:'LINE: huang88', notes:'', pets:[{type:'goose',name:'阿鵝、二鵝',qty:5}]});
  add({checkIn:addDays(t,3), checkOut:addDays(t,6), ownerName:'張先生', contact:'0911-222-333', notes:'', pets:[{type:'duck',name:'小黃們',qty:6},{type:'dog',name:'旺財',qty:1}]});
  return {
    mode:'demo',
    onAuth(){},
    async login(_, pw){ if (pw !== CONFIG.adminPin) throw new Error('auth/wrong-password'); enterAdmin(); },
    async logout(){ leaveAdmin(); },
    subscribePublic(f){ subsP.push(f); f(snap(pub)); },
    subscribePrivate(f){ subsV.push(f); f(snap(priv)); },
    subscribeGallery(f){ subsG.push(f); f(snap(gal)); },
    async addGallery(src){ gal.push({id:'g'+(seq++), src, caption:'', order:Date.now()}); emitG(); },
    async updateGallery(id, patch){ const g = gal.find(x => x.id === id); if (g) Object.assign(g, patch); emitG(); },
    async deleteGallery(id){ const i = gal.findIndex(x => x.id === id); if (i >= 0) gal.splice(i, 1); emitG(); },
    async create(data){
      const wf = wfCount(data.pets);
      if (wf > 0) for (const d of nightsOf(data.checkIn, data.checkOut))
        if (occupancyOn(d, pub) + wf > CAP) throw new FullError(d);
      add(data); emit();
    },
    async cancel(id){ [pub, priv].forEach(arr => { const x = arr.find(b => b.id === id); if (x) x.status = 'canceled'; }); emit(); },
    async setPhoto(id, i, photo){ [pub, priv].forEach(arr => { const x = arr.find(b => b.id === id); if (x && x.pets[i]) x.pets[i] = {...x.pets[i], photo}; }); emit(); }
  };
}

/* ================== 資料層：Firebase ================== */
async function makeFirebaseStore(cfg){
  const V = '10.12.2';
  const app = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs  = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const au  = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const fbApp = app.initializeApp(cfg);
  const db = fs.getFirestore(fbApp);
  const auth = au.getAuth(fbApp);
  const since = addDays(today(), -60);
  const sub = (col, f) => fs.onSnapshot(
    fs.query(fs.collection(db, col), fs.where('checkOut', '>=', since)),
    s => f(s.docs.map(d => ({id:d.id, ...d.data()}))),
    err => { console.error(err); toast('讀取資料失敗，請檢查網路或 Firebase 設定'); }
  );
  return {
    mode:'firebase',
    onAuth: f => au.onAuthStateChanged(auth, u => f(!!u)),
    login: (email, pw) => au.signInWithEmailAndPassword(auth, email, pw),
    logout: () => au.signOut(auth),
    subscribePublic: f => sub('duck_public', f),
    subscribePrivate: f => sub('duck_bookings', f),
    subscribeGallery: f => fs.onSnapshot(fs.collection(db, 'duck_gallery'), s => f(s.docs.map(d => ({id:d.id, ...d.data()}))), err => console.error(err)),
    addGallery: src => fs.addDoc(fs.collection(db, 'duck_gallery'), {src, caption:'', order:Date.now()}),
    updateGallery: (id, patch) => fs.updateDoc(fs.doc(db, 'duck_gallery', id), patch),
    deleteGallery: id => fs.deleteDoc(fs.doc(db, 'duck_gallery', id)),
    async create(data){
      const {pub, priv} = splitDoc(data);
      const nights = nightsOf(data.checkIn, data.checkOut);
      await fs.runTransaction(db, async tx => {
        const refs = pub.waterfowl > 0 ? nights.map(d => fs.doc(db, 'duck_capacity', d)) : [];
        const counts = [];
        for (const r of refs){ const s = await tx.get(r); counts.push(s.exists() ? (s.data().count||0) : 0); }
        counts.forEach((c,i) => { if (c + pub.waterfowl > CAP) throw new FullError(nights[i]); });
        refs.forEach((r,i) => tx.set(r, {count: counts[i] + pub.waterfowl}, {merge:true}));
        const pRef = fs.doc(fs.collection(db, 'duck_public'));
        tx.set(pRef, pub);
        tx.set(fs.doc(db, 'duck_bookings', pRef.id), priv);
      });
    },
    async setPhoto(id, i, photo){
      await fs.runTransaction(db, async tx => {
        const refs = [fs.doc(db, 'duck_public', id), fs.doc(db, 'duck_bookings', id)];
        const snaps = []; for (const r of refs) snaps.push(await tx.get(r));
        snaps.forEach((sn, k) => { if (!sn.exists()) return; const pets = [...sn.data().pets]; if (pets[i]) { pets[i] = {...pets[i], photo}; tx.update(refs[k], {pets}); } });
      });
    },
    async cancel(id){
      await fs.runTransaction(db, async tx => {
        const pRef = fs.doc(db, 'duck_public', id);
        const s = await tx.get(pRef);
        if (!s.exists() || s.data().status === 'canceled') return;
        const b = s.data();
        const refs = b.waterfowl > 0 ? nightsOf(b.checkIn, b.checkOut).map(d => fs.doc(db, 'duck_capacity', d)) : [];
        const counts = [];
        for (const r of refs){ const c = await tx.get(r); counts.push(c.exists() ? (c.data().count||0) : 0); }
        refs.forEach((r,i) => tx.set(r, {count: Math.max(0, counts[i] - b.waterfowl)}, {merge:true}));
        tx.update(pRef, {status:'canceled'});
        tx.update(fs.doc(db, 'duck_bookings', id), {status:'canceled'});
      });
    }
  };
}

function compressWide(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const M = 1280, k = Math.min(1, M / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let q = 0.8, out = c.toDataURL('image/jpeg', q);
      while (out.length > 700000 && q > 0.4){ q -= 0.1; out = c.toDataURL('image/jpeg', q); }  // Firestore 單筆上限 1MB
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}
function compressPhoto(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const S = 240, side = Math.min(img.width, img.height), c = document.createElement('canvas');
      c.width = c.height = S;
      c.getContext('2d').drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, S, S);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}
function pickPhoto(){
  return new Promise(res => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = async () => { const f = inp.files[0]; if (!f) return res(null);
      try { res(await compressPhoto(f)); } catch { toast('這張照片讀不出來，換一張試試'); res(null); } };
    inp.click();
  });
}

}

function rangeCheck(){
  const a = $('#checkIn').value, b = $('#checkOut').value;
  if (!a || !b || b <= a) return null;
  const nights = nightsOf(a, b), need = wfCount(formPets);
  const peak = Math.max(...nights.map(d => occupancyOn(d)));
  return {nights:nights.length, left:CAP - peak, need, fullDay:nights.find(d => occupancyOn(d) + need > CAP)};
}

    box.textContent = r.left <= 0 ? `${md(r.fullDay)} 鴨鵝已經額滿了，請換個日期。`
      : `這段期間鴨鵝最多只剩 ${r.left} 位，你選了 ${r.need} 隻，請減少數量或換日期。`;
  } else {

}

/* ================== 館內環境 ================== */
let galleryList = [];
function renderGallery(){
  const list = [...galleryList].sort((a,b) => (a.order||0) - (b.order||0));
  const shown = list.length ? list : DEFAULT_GALLERY.map((g,k) => ({id:'d'+k, ...g}));
  $('#galleryPanel').hidden = !shown.length;
  $('#gallery').innerHTML = shown.map(g => `<button type="button" class="g-item" data-zoom="g:${g.id}" aria-label="放大${g.caption ? ' ' + esc(g.caption) : '環境照片'}">
    <img src="${g.src}" alt="${esc(g.caption)}" loading="lazy"><span class="g-cap">${esc(g.caption)}</span></button>`).join('');
  if (!adminOn) return;
  $('#galleryAdminList').innerHTML = list.length ? list.map((g,k) => `<div class="ga-row">
    <img src="${g.src}" alt="">
    <input class="field" data-cap="${g.id}" value="${esc(g.caption)}" placeholder="說明，例如：戲水池" aria-label="照片說明">
    <div class="ga-tools">
      ${k>0 ? `<button type="button" data-move="${g.id}:-1">往前</button>` : ''}
      ${k<list.length-1 ? `<button type="button" data-move="${g.id}:1">往後</button>` : ''}
      <button type="button" class="del" data-del="${g.id}">刪除</button>
    </div></div>`).join('') : '<div class="empty-state">還沒有環境照片。</div>';
}
$('#addGallery').addEventListener('click', () => {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
  inp.onchange = async () => {
    const files = [...inp.files]; if (!files.length) return;
    toast(`上傳中（${files.length} 張）…`);
    let ok = 0;
    for (const f of files){ try { await store.addGallery(await compressWide(f)); ok++; } catch (ex){ console.error(ex); } }
    toast(ok === files.length ? '環境照片已上傳' : `有 ${files.length - ok} 張沒有上傳成功`);
  };
  inp.click();
});
$('#galleryAdminList').addEventListener('change', async e => {
  const c = e.target.closest('[data-cap]'); if (!c) return;
  try { await store.updateGallery(c.dataset.cap, {caption:c.value.trim()}); toast('說明已儲存'); } catch (ex){ console.error(ex); toast('儲存失敗'); }
});
$('#galleryAdminList').addEventListener('click', async e => {
  const d = e.target.closest('[data-del]'), m = e.target.closest('[data-move]');
  if (d){
    if (!confirm('確定要刪除這張環境照片嗎？')) return;
    try { await store.deleteGallery(d.dataset.del); } catch (ex){ console.error(ex); toast('刪除失敗'); }
  } else if (m){
    const [id, dir] = m.dataset.move.split(':');
    const list = [...galleryList].sort((a,b) => (a.order||0) - (b.order||0));
    const i = list.findIndex(g => g.id === id), j = i + Number(dir);
    if (j < 0 || j >= list.length) return;
    const a = list[i], b = list[j];
    try { await Promise.all([store.updateGallery(a.id, {order:b.order}), store.updateGallery(b.id, {order:a.order})]); }
    catch (ex){ console.error(ex); toast('調整順序失敗'); }
  }
});
let store;
(async () => {
  $('#checkIn').min = today(); $('#checkOut').min = addDays(today(), 1);
  renderPetRows();
  try { store = CONFIG.firebase ? await makeFirebaseStore(CONFIG.firebase) : makeDemoStore(); }
  catch (ex){ console.error(ex); store = makeDemoStore(); toast('雲端連線失敗，先用預覽模式'); }
  $('#demoNote').hidden = store.mode !== 'demo';
  if (store.mode === 'firebase'){
    $('#emailInput').hidden = false;
    store.onAuth(on => on ? enterAdmin() : leaveAdmin());
  }
  store.subscribePublic(l => { publicList = l; renderAll(); });
  store.subscribeGallery(l => { galleryList = l; renderGallery(); });
})();
</script>
</body>
